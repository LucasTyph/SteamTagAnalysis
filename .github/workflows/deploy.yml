name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", "pipeline/tracking/**", ".github/workflows/deploy.yml"]
  # Redeploy after each daily tracking run (New Releases) and each monthly data refresh
  # (its commits come from GITHUB_TOKEN, which doesn't trigger push workflows).
  workflow_run:
    workflows: ["Track new releases", "Refresh main dataset"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Skip when a triggering run was cancelled or failed; the last deploy stays up.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # New Releases data is generated from the tracking-data branch at build time,
      # so main's history stays free of daily data.
      - uses: actions/checkout@v7
        with:
          ref: tracking-data
          path: tracking-data
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e .
      - run: stp track export --dir tracking-data --out web/public/data/releases

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          # Project site lives at https://<user>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
