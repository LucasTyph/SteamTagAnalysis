name: Track new releases

# Once a day: find newly released Steam games, snapshot every tracked game's reviews,
# and refresh exact daily review counts. Data is committed to the `tracking-data`
# branch as plain CSV. See pipeline/tracking/.
on:
  schedule:
    - cron: "23 6 * * *" # 06:23 UTC daily (off the hour, when Actions is less busy)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: track-releases
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          ref: tracking-data
          path: tracking-data

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -e .

      - name: Daily tracking run
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        # Stops cleanly before the job limit; anything unfinished goes first tomorrow.
        # `exec` so stp itself receives the cancel signal and saves before exiting.
        run: exec stp track daily --dir tracking-data --budget 5h

      - name: Commit data
        if: always()
        working-directory: tracking-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -q -m "Tracking run $(date -u +%F)"
          git push -q origin tracking-data
