name: Track new releases

# Once a day: find newly released Steam games, snapshot every tracked game's reviews,
# and refresh exact daily review counts. Data is committed to the `tracking-data`
# branch as plain CSV. See pipeline/tracking/.
on:
  schedule:
    - cron: "23 6 * * *" # 06:23 UTC daily (off the hour, when Actions is less busy)
    # Backup: GitHub can start scheduled runs hours late or drop them. This one does
    # nothing if today's run already completed, and finishes it otherwise.
    - cron: "41 17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write # for tracking-alert issues

concurrency:
  group: track-releases
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          ref: tracking-data
          path: tracking-data

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -e .

      - name: Daily tracking run
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        # Stops cleanly before the job limit; anything unfinished goes first tomorrow.
        # `exec` so stp itself receives the cancel signal and saves before exiting.
        # Scheduled runs skip a day that already completed; manual runs always run.
        run: >-
          exec stp track daily --dir tracking-data --budget 5h
          ${{ github.event_name == 'schedule' && '--skip-if-done' || '' }}

      - name: Commit data
        if: always()
        working-directory: tracking-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -q -m "Tracking run $(date -u +%F)"
          git push -q origin tracking-data

      # --- Alerts: a `tracking-alert` issue (GitHub emails you about it) -----------------

      - name: Check the day is complete (backup run only)
        if: always() && github.event.schedule == '41 17 * * *'
        run: stp track check --dir tracking-data

      - name: Open or update alert issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create tracking-alert --color d73a4a --description "Daily release tracking needs attention" 2>/dev/null || true
          num=$(gh issue list --label tracking-alert --state open --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "Still failing on $(date -u +%F): $RUN_URL"
          else
            gh issue create --label tracking-alert --title "Release tracking needs attention" --body "A scheduled tracking run failed or the day did not complete ($(date -u +%F)).

          Run: $RUN_URL

          Days that are missed are not lost: the next run resumes where this one stopped, and the
          exact daily counts cover the last 30 days. This issue closes itself after the next
          complete run."
          fi

      - name: Close alert after a complete run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          stp track check --dir tracking-data >/dev/null || exit 0
          for num in $(gh issue list --label tracking-alert --state open --json number --jq '.[].number'); do
            gh issue close "$num" --comment "Resolved: the run for $(date -u +%F) completed."
          done
