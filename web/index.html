<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Steam Tag Analysis</title>
    <meta
      name="description"
      content="Which Steam genre mixes beat expectations, and how reception changes after launch: 60,000 games, interactive and updated monthly."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1215" media="(prefers-color-scheme: dark)" />

    <!-- Link previews. %SITE_URL% is filled in at build time from VITE_SITE_URL (vite.config.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Steam Tag Analysis" />
    <meta property="og:title" content="Steam Tag Analysis" />
    <meta
      property="og:description"
      content="Which Steam genre mixes beat expectations, and how reception changes after launch: 60,000 games, interactive and updated monthly."
    />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Steam Tag Analysis: a network of Steam tags coloured by whether they raise or lower review scores."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
