[project]
name = "steam-tag-analysis"
version = "0.1.0"
description = "Steam tag-mix and review-timeline analysis pipeline"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
analysis = [
    "duckdb>=1.1",
    "polars>=1.9",
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "ruptures>=1.1",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[project.scripts]
stp = "pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
